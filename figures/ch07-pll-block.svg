<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Phase-locked loop block diagram: reference oscillator, phase detector, loop filter, VCO, divide-by-N feedback; DDS contrast chain below">
  <title>Phase-locked loop — an electronic servo loop (pool E7H03/E7H06), with a direct digital synthesizer chain for contrast (pool E7H09–E7H11)</title>

  <!-- ===== Title ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="430" y="34" font-size="17" font-weight="bold">PHASE-LOCKED LOOP — AN ELECTRONIC SERVO LOOP</text>
    <text x="430" y="56" font-size="11.5">the phase detector's error voltage steers the VCO until the divided output matches the reference — then the loop is locked</text>
  </g>

  <!-- ===== Section 1: the PLL loop (pool E7H03) ===== -->
  <text x="40" y="92" font-size="12.5" font-weight="bold" fill="currentColor" stroke="none">1 &#183; THE LOOP (pool E7H03)</text>

  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="40" y="110" width="150" height="70" rx="8"/>
    <rect x="250" y="110" width="150" height="70" rx="8"/>
    <rect x="460" y="110" width="140" height="70" rx="8"/>
    <rect x="660" y="110" width="120" height="70" rx="8"/>
    <rect x="250" y="230" width="150" height="70" rx="8"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="115" y="138" font-size="11.5" font-weight="bold">REFERENCE</text>
    <text x="115" y="154" font-size="11.5" font-weight="bold">OSCILLATOR</text>
    <text x="115" y="170" font-size="9.5" font-style="italic">stable (crystal) &#183; f_ref</text>

    <text x="325" y="138" font-size="11.5" font-weight="bold">PHASE</text>
    <text x="325" y="154" font-size="11.5" font-weight="bold">DETECTOR</text>
    <text x="325" y="170" font-size="9.5" font-style="italic">compares the phases</text>

    <text x="530" y="138" font-size="11.5" font-weight="bold">LOOP FILTER</text>
    <text x="530" y="156" font-size="9.5" font-style="italic">low-pass &#183; smooths</text>
    <text x="530" y="169" font-size="9.5" font-style="italic">the error voltage</text>

    <text x="720" y="141" font-size="12" font-weight="bold">VCO</text>
    <text x="720" y="159" font-size="9.5" font-style="italic">voltage-controlled</text>
    <text x="720" y="172" font-size="9.5" font-style="italic">oscillator</text>

    <text x="325" y="258" font-size="13" font-weight="bold">&#247; N</text>
    <text x="325" y="278" font-size="9.5" font-style="italic">feedback divider</text>
  </g>

  <!-- forward-path arrows -->
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="192" y1="145" x2="242" y2="145"/>
    <line x1="402" y1="145" x2="452" y2="145"/>
    <line x1="602" y1="145" x2="652" y2="145"/>
    <line x1="782" y1="145" x2="826" y2="145"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="250,145 241,141 241,149"/>
    <polygon points="460,145 451,141 451,149"/>
    <polygon points="660,145 651,141 651,149"/>
    <polygon points="834,145 825,141 825,149"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="9.5" font-style="italic">
    <text x="626" y="133">control voltage</text>
    <text x="836" y="133" text-anchor="end">OUTPUT</text>
  </g>

  <!-- feedback path: output node down, left through ÷N, up into the phase detector -->
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="745" y1="145" x2="745" y2="265"/>
    <line x1="745" y1="265" x2="408" y2="265"/>
    <line x1="325" y1="228" x2="325" y2="188"/>
  </g>
  <g fill="currentColor" stroke="none">
    <circle cx="745" cy="145" r="4"/>
    <polygon points="400,265 409,261 409,269"/>
    <polygon points="325,180 321,189 329,189"/>
    <text x="560" y="255" font-size="9.5" font-style="italic" text-anchor="middle">feedback: a sample of the output, divided by N</text>
  </g>

  <!-- lock condition -->
  <rect x="190" y="318" width="480" height="42" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="430" y="336" font-size="11.5" font-weight="bold">LOCKED: f_out = N &#215; f_ref — pick N, get an exact crystal-referenced frequency</text>
    <text x="430" y="352" font-size="10">E7H06: a PLL can perform frequency synthesis and FM demodulation</text>
  </g>

  <!-- ===== Section 2: DDS contrast (pool E7H09–E7H11) ===== -->
  <text x="40" y="400" font-size="12.5" font-weight="bold" fill="currentColor" stroke="none">2 &#183; CONTRAST — DIRECT DIGITAL SYNTHESIZER (DDS): no loop, no VCO (pool E7H09–E7H11)</text>

  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="40" y="418" width="170" height="70" rx="8"/>
    <rect x="270" y="418" width="170" height="70" rx="8"/>
    <rect x="500" y="418" width="90" height="70" rx="8"/>
    <rect x="650" y="418" width="160" height="70" rx="8"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="125" y="446" font-size="11" font-weight="bold">PHASE</text>
    <text x="125" y="462" font-size="11" font-weight="bold">ACCUMULATOR</text>
    <text x="125" y="478" font-size="9" font-style="italic">steps phase each clock</text>

    <text x="355" y="443" font-size="11" font-weight="bold">LOOKUP TABLE</text>
    <text x="355" y="460" font-size="9" font-style="italic">amplitude values representing</text>
    <text x="355" y="473" font-size="9" font-style="italic">the desired waveform (E7H10)</text>

    <text x="545" y="448" font-size="12" font-weight="bold">DAC</text>
    <text x="545" y="466" font-size="9" font-style="italic">digital to analog</text>

    <text x="730" y="443" font-size="11" font-weight="bold">LOW-PASS FILTER</text>
    <text x="730" y="460" font-size="9" font-style="italic">anti-alias &#183; removes sampling</text>
    <text x="730" y="473" font-size="9" font-style="italic">artifacts (E7H09)</text>
  </g>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="212" y1="453" x2="262" y2="453"/>
    <line x1="442" y1="453" x2="492" y2="453"/>
    <line x1="592" y1="453" x2="642" y2="453"/>
    <line x1="812" y1="453" x2="836" y2="453"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="270,453 261,449 261,457"/>
    <polygon points="500,453 491,449 491,457"/>
    <polygon points="650,453 641,449 641,457"/>
    <polygon points="844,453 835,449 835,457"/>
  </g>

  <text x="430" y="522" font-size="10.5" font-style="italic" fill="currentColor" stroke="none" text-anchor="middle">DDS major spectral impurities: spurious signals at DISCRETE frequencies — not broadband noise (E7H11)</text>
</svg>
