<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 465" font-family="sans-serif">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,0 L 9,3 L 0,6 Z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- ===== Temperature inversion layer aloft ===== -->
  <line x1="30" y1="110" x2="730" y2="110" stroke="currentColor" stroke-width="1.6" stroke-dasharray="8,5" fill="none"/>
  <line x1="30" y1="148" x2="730" y2="148" stroke="currentColor" stroke-width="1.6" stroke-dasharray="8,5" fill="none"/>

  <!-- ===== High-pressure glyph ("lift" weather) ===== -->
  <circle cx="690" cy="60" r="12" fill="none" stroke="currentColor" stroke-width="1.6"/>

  <!-- ===== Ordinary ray: no inversion, the signal escapes ===== -->
  <path d="M 97,322 L 216,86" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="6,5" opacity="0.55" marker-end="url(#arrow)"/>

  <!-- ===== Ducted ray: trapped between surface and inversion, over water and land ===== -->
  <path d="M 97,322 Q 165,168 218,166 Q 272,164 313,388 Q 362,168 420,166 Q 478,164 528,388 Q 595,168 673,320"
        fill="none" stroke="currentColor" stroke-width="2.4" marker-end="url(#arrow)"/>
  <circle cx="313" cy="386" r="3" fill="currentColor" stroke="none"/>
  <circle cx="528" cy="386" r="3" fill="currentColor" stroke="none"/>

  <!-- ===== Ground: land with hatching, water with waves ===== -->
  <line x1="30" y1="390" x2="740" y2="390" stroke="currentColor" stroke-width="2.2" fill="none"/>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.7" fill="none">
    <line x1="45" y1="390" x2="36" y2="401"/>
    <line x1="75" y1="390" x2="66" y2="401"/>
    <line x1="105" y1="390" x2="96" y2="401"/>
    <line x1="135" y1="390" x2="126" y2="401"/>
    <line x1="165" y1="390" x2="156" y2="401"/>
    <line x1="195" y1="390" x2="186" y2="401"/>
    <line x1="225" y1="390" x2="216" y2="401"/>
    <line x1="255" y1="390" x2="246" y2="401"/>
    <line x1="505" y1="390" x2="496" y2="401"/>
    <line x1="535" y1="390" x2="526" y2="401"/>
    <line x1="565" y1="390" x2="556" y2="401"/>
    <line x1="595" y1="390" x2="586" y2="401"/>
    <line x1="625" y1="390" x2="616" y2="401"/>
    <line x1="655" y1="390" x2="646" y2="401"/>
    <line x1="685" y1="390" x2="676" y2="401"/>
    <line x1="715" y1="390" x2="706" y2="401"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.7" fill="none">
    <path d="M 275,396 Q 283,392 291,396 T 307,396 T 323,396 T 339,396 T 355,396 T 371,396 T 387,396 T 403,396 T 419,396 T 435,396 T 451,396 T 467,396 T 483,396"/>
    <path d="M 283,402 Q 291,398 299,402 T 315,402 T 331,402 T 347,402 T 363,402 T 379,402 T 395,402 T 411,402 T 427,402 T 443,402 T 459,402 T 475,402"/>
  </g>

  <!-- ===== TX station ===== -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <line x1="90" y1="390" x2="90" y2="322"/>
    <line x1="90" y1="322" x2="79" y2="311"/>
    <line x1="90" y1="322" x2="101" y2="311"/>
    <line x1="90" y1="322" x2="90" y2="305"/>
  </g>

  <!-- ===== RX station, hundreds of miles on ===== -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <line x1="680" y1="390" x2="680" y2="322"/>
    <line x1="680" y1="322" x2="669" y2="311"/>
    <line x1="680" y1="322" x2="691" y2="311"/>
    <line x1="680" y1="322" x2="680" y2="305"/>
  </g>

  <!-- ===== Labels ===== -->
  <g fill="currentColor" stroke="none">
    <text x="38" y="102" font-size="11.5">temperature inversion: warm air over cool</text>
    <text x="228" y="82" font-size="11.5" opacity="0.8">without an inversion, the signal escapes</text>
    <text x="690" y="65" text-anchor="middle" font-size="13" font-weight="bold">H</text>
    <text x="674" y="64" text-anchor="end" font-size="11">high pressure = 'lift' weather</text>
    <text x="118" y="258" font-size="11.5" transform="rotate(-66.2 118 258)">trapped in the duct</text>
    <text x="610" y="242" text-anchor="middle" font-size="11.5">hundreds of miles</text>
    <text x="380" y="420" text-anchor="middle" font-size="11">large body of water</text>
    <text x="78" y="383" text-anchor="end" font-size="11.5" font-weight="bold">TX</text>
    <text x="692" y="383" text-anchor="start" font-size="11.5" font-weight="bold">RX</text>

    <text x="380" y="440" text-anchor="middle" font-size="12">The inversion traps VHF/UHF against the surface and carries it far beyond the normal horizon - a tropospheric duct.</text>
    <text x="380" y="459" text-anchor="middle" font-size="12">Ducts form over large bodies of water: typical range 100-300 miles. High-pressure inversion weather is a 'lift'.</text>
  </g>
</svg>
