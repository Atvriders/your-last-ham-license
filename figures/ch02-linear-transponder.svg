<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 656" font-family="sans-serif">

  <!-- ===== title ===== -->
  <text x="380" y="28" text-anchor="middle" font-size="13.5" font-weight="bold" fill="currentColor" stroke="none">a linear transponder — a bent pipe in the sky</text>

  <!-- ===== the bent pipe ===== -->
  <!-- station A -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <line x1="95" y1="196" x2="95" y2="168"/>
    <line x1="95" y1="168" x2="117" y2="146"/>
    <line x1="98.5" y1="156.1" x2="106.9" y2="164.5"/>
    <line x1="105.1" y1="149.5" x2="113.5" y2="157.9"/>
    <line x1="111.7" y1="142.9" x2="120.1" y2="151.3"/>
  </g>
  <text x="95" y="216" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">you transmit</text>

  <!-- uplink arrow into the satellite -->
  <line x1="123" y1="154" x2="262" y2="120" stroke="currentColor" stroke-width="2.4" fill="none"/>
  <polygon points="262,120 249.2,118.5 251.4,127.3" fill="currentColor" stroke="none"/>
  <text x="130" y="110" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">uplink passband</text>
  <text x="130" y="125" text-anchor="middle" font-size="9.5" font-style="italic" fill="currentColor" stroke="none">everyone at once</text>

  <!-- satellite box: mixer + LO -->
  <rect x="270" y="64" width="230" height="94" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="270" y1="116" x2="306" y2="116" stroke="currentColor" stroke-width="2" fill="none"/>
  <circle cx="320" cy="116" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
  <g stroke="currentColor" stroke-width="1.6" fill="none">
    <line x1="311" y1="107" x2="329" y2="125"/>
    <line x1="329" y1="107" x2="311" y2="125"/>
  </g>
  <text x="320" y="98" text-anchor="middle" font-size="9" fill="currentColor" stroke="none">mixer</text>
  <circle cx="320" cy="145" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="320" y="149" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">~</text>
  <line x1="320" y1="137.5" x2="320" y2="130" stroke="currentColor" stroke-width="1.6" fill="none"/>
  <text x="332" y="149" font-size="9" fill="currentColor" stroke="none">local oscillator</text>
  <line x1="334" y1="116" x2="500" y2="116" stroke="currentColor" stroke-width="2" fill="none"/>
  <text x="417" y="106" text-anchor="middle" font-size="9.5" font-style="italic" fill="currentColor" stroke="none">difference product out</text>

  <!-- downlink arrow out of the satellite -->
  <line x1="508" y1="116" x2="642" y2="158" stroke="currentColor" stroke-width="2.4" fill="none"/>
  <polygon points="642,158 629.2,150.1 631.9,158.7" fill="currentColor" stroke="none"/>
  <text x="575" y="122" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">downlink passband</text>

  <!-- station B -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <line x1="665" y1="196" x2="665" y2="168"/>
    <line x1="665" y1="168" x2="643" y2="146"/>
    <line x1="653.1" y1="164.5" x2="661.5" y2="156.1"/>
    <line x1="646.5" y1="157.9" x2="654.9" y2="149.5"/>
    <line x1="639.9" y1="151.3" x2="648.3" y2="142.9"/>
  </g>
  <text x="665" y="216" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">you receive</text>

  <text x="380" y="240" text-anchor="middle" font-size="11" font-style="italic" fill="currentColor" stroke="none">it relays any mode — CW · SSB · FM · SSTV · data — because it shifts the passband without demodulating it</text>

  <!-- ===== divider ===== -->
  <line x1="30" y1="262" x2="730" y2="262" stroke="currentColor" stroke-width="1" opacity="0.35" fill="none"/>
  <text x="380" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="currentColor" stroke="none">inverting vs non-inverting — what happens to your signal</text>

  <!-- ===== panel A: non-inverting ===== -->
  <text x="200" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="currentColor" stroke="none">non-inverting: order preserved</text>
  <text x="56" y="341" text-anchor="end" font-size="10" fill="currentColor" stroke="none">uplink</text>
  <rect x="60" y="324" width="280" height="26" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="66" y="341" font-size="9" fill="currentColor" stroke="none">low</text>
  <text x="334" y="341" text-anchor="end" font-size="9" fill="currentColor" stroke="none">high</text>
  <polygon points="102,350 110,328 118,350" fill="currentColor" stroke="none"/>
  <text x="110" y="318" text-anchor="middle" font-size="10" fill="currentColor" stroke="none">USB</text>
  <line x1="200" y1="354" x2="200" y2="400" stroke="currentColor" stroke-width="1.8" fill="none"/>
  <polygon points="200,400 195,390 205,390" fill="currentColor" stroke="none"/>
  <text x="212" y="382" font-size="10" font-style="italic" fill="currentColor" stroke="none">same orientation</text>
  <text x="56" y="421" text-anchor="end" font-size="10" fill="currentColor" stroke="none">downlink</text>
  <rect x="60" y="404" width="280" height="26" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <polygon points="102,430 110,408 118,430" fill="currentColor" stroke="none"/>
  <text x="110" y="448" text-anchor="middle" font-size="10" fill="currentColor" stroke="none">still USB, still low end</text>
  <text x="200" y="472" text-anchor="middle" font-size="10.5" font-style="italic" fill="currentColor" stroke="none">a shifted copy — same order, same sideband</text>

  <!-- ===== panel B: inverting ===== -->
  <text x="560" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="currentColor" stroke="none">inverting: everything flips</text>
  <text x="416" y="341" text-anchor="end" font-size="10" fill="currentColor" stroke="none">uplink</text>
  <rect x="420" y="324" width="280" height="26" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <text x="426" y="341" font-size="9" fill="currentColor" stroke="none">low</text>
  <text x="694" y="341" text-anchor="end" font-size="9" fill="currentColor" stroke="none">high</text>
  <polygon points="462,350 470,328 478,350" fill="currentColor" stroke="none"/>
  <text x="470" y="318" text-anchor="middle" font-size="10" fill="currentColor" stroke="none">USB</text>
  <line x1="470" y1="354" x2="670" y2="400" stroke="currentColor" stroke-width="1.8" fill="none"/>
  <polygon points="670,400 657.3,392.9 659.3,401.7" fill="currentColor" stroke="none"/>
  <text x="480" y="392" font-size="9.5" font-style="italic" fill="currentColor" stroke="none">flipped end for end</text>
  <text x="416" y="421" text-anchor="end" font-size="10" fill="currentColor" stroke="none">downlink</text>
  <rect x="420" y="404" width="280" height="26" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <polygon points="662,430 670,408 678,430" fill="currentColor" stroke="none"/>
  <text x="670" y="448" text-anchor="middle" font-size="10" fill="currentColor" stroke="none">LSB — at the high end</text>
  <text x="560" y="472" text-anchor="middle" font-size="10.5" font-style="italic" fill="currentColor" stroke="none">USB in → LSB out; band positions reverse</text>
  <text x="560" y="488" text-anchor="middle" font-size="10.5" font-style="italic" fill="currentColor" stroke="none">uplink and downlink Doppler move in opposite directions</text>
  <text x="560" y="504" text-anchor="middle" font-size="10.5" font-weight="bold" fill="currentColor" stroke="none">→ the shifts partially cancel</text>

  <!-- ===== divider ===== -->
  <line x1="30" y1="524" x2="730" y2="524" stroke="currentColor" stroke-width="1" opacity="0.35" fill="none"/>
  <text x="380" y="546" text-anchor="middle" font-size="12.5" font-weight="bold" fill="currentColor" stroke="none">Doppler shifts both legs</text>

  <!-- Doppler: inverting partial cancellation -->
  <g fill="none" stroke="currentColor" stroke-width="2">
    <line x1="70" y1="618" x2="70" y2="574"/>
    <line x1="95" y1="574" x2="95" y2="618"/>
  </g>
  <polygon points="70,566 65,576 75,576" fill="currentColor" stroke="none"/>
  <polygon points="95,626 90,616 100,616" fill="currentColor" stroke="none"/>
  <g fill="currentColor" stroke="none">
    <text x="215" y="580" text-anchor="middle" font-size="11.5" font-weight="bold">on an inverting transponder</text>
    <text x="215" y="598" text-anchor="middle" font-size="10.5">the two legs' Doppler shifts oppose each other</text>
    <text x="215" y="614" text-anchor="middle" font-size="10.5">→ partial cancellation: less tuning through a pass</text>
  </g>

  <!-- Doppler magnitudes -->
  <g fill="currentColor" stroke="none">
    <text x="555" y="580" text-anchor="middle" font-size="11.5" font-weight="bold">how big is LEO Doppler?</text>
    <text x="555" y="598" text-anchor="middle" font-size="10.5">about ±3.5 kHz on 2 m · about ±10 kHz on 70 cm</text>
    <text x="555" y="614" text-anchor="middle" font-size="10.5">tune the higher-frequency link — it moves the most</text>
  </g>

  <!-- ===== power manners ===== -->
  <text x="380" y="646" text-anchor="middle" font-size="10.5" font-style="italic" fill="currentColor" stroke="none">power manners: the downlink's power is shared — run your uplink so your downlink sounds about as strong as the satellite's beacon</text>
</svg>
