<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="sans-serif">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,0 L 9,3 L 0,6 Z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="380" y="30" text-anchor="middle" font-size="14" font-weight="bold" letter-spacing="3" fill="currentColor" stroke="none">THE PATH</text>

  <!-- ===== E region: trails ionize here ===== -->
  <line x1="40" y1="70" x2="720" y2="70" stroke="currentColor" stroke-width="1.6" stroke-dasharray="8,5" fill="none"/>

  <!-- ===== Meteor: head, ionized trail, direction of fall ===== -->
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <line x1="335" y1="48" x2="393" y2="79" stroke-width="3" opacity="0.75"/>
    <line x1="338" y1="44" x2="396" y2="75" stroke-width="1" opacity="0.4"/>
    <line x1="332" y1="52" x2="390" y2="83" stroke-width="1" opacity="0.4"/>
  </g>
  <circle cx="399" cy="83" r="3.5" fill="currentColor" stroke="none"/>

  <!-- ===== Ground with hatching ===== -->
  <line x1="40" y1="290" x2="720" y2="290" stroke="currentColor" stroke-width="2.2" fill="none"/>
  <g stroke="currentColor" stroke-width="1.2" opacity="0.7" fill="none">
    <line x1="55" y1="290" x2="46" y2="301"/>
    <line x1="85" y1="290" x2="76" y2="301"/>
    <line x1="115" y1="290" x2="106" y2="301"/>
    <line x1="145" y1="290" x2="136" y2="301"/>
    <line x1="175" y1="290" x2="166" y2="301"/>
    <line x1="205" y1="290" x2="196" y2="301"/>
    <line x1="235" y1="290" x2="226" y2="301"/>
    <line x1="265" y1="290" x2="256" y2="301"/>
    <line x1="295" y1="290" x2="286" y2="301"/>
    <line x1="325" y1="290" x2="316" y2="301"/>
    <line x1="355" y1="290" x2="346" y2="301"/>
    <line x1="385" y1="290" x2="376" y2="301"/>
    <line x1="415" y1="290" x2="406" y2="301"/>
    <line x1="445" y1="290" x2="436" y2="301"/>
    <line x1="475" y1="290" x2="466" y2="301"/>
    <line x1="505" y1="290" x2="496" y2="301"/>
    <line x1="535" y1="290" x2="526" y2="301"/>
    <line x1="565" y1="290" x2="556" y2="301"/>
    <line x1="595" y1="290" x2="586" y2="301"/>
    <line x1="625" y1="290" x2="616" y2="301"/>
    <line x1="655" y1="290" x2="646" y2="301"/>
    <line x1="685" y1="290" x2="676" y2="301"/>
    <line x1="715" y1="290" x2="706" y2="301"/>
  </g>

  <!-- ===== TX station ===== -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <line x1="100" y1="290" x2="100" y2="222"/>
    <line x1="100" y1="222" x2="89" y2="211"/>
    <line x1="100" y1="222" x2="111" y2="211"/>
    <line x1="100" y1="222" x2="100" y2="205"/>
  </g>

  <!-- ===== RX station ===== -->
  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <line x1="660" y1="290" x2="660" y2="222"/>
    <line x1="660" y1="222" x2="649" y2="211"/>
    <line x1="660" y1="222" x2="671" y2="211"/>
    <line x1="660" y1="222" x2="660" y2="205"/>
  </g>

  <!-- ===== Beams meet at the trail: TX up, scattered down to RX ===== -->
  <path d="M 107,208 L 372,76" fill="none" stroke="currentColor" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M 388,79 L 653,208" fill="none" stroke="currentColor" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- ===== Panel divider ===== -->
  <line x1="40" y1="322" x2="720" y2="322" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4,5" opacity="0.35"/>
  <text x="380" y="352" text-anchor="middle" font-size="14" font-weight="bold" letter-spacing="3" fill="currentColor" stroke="none">WHAT THE RECEIVER HEARS</text>

  <!-- ===== Timeline axes ===== -->
  <path d="M 60,470 L 60,425" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 60,470 L 716,470" fill="none" stroke="currentColor" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== Pings: narrow spikes, fractions of a second ===== -->
  <g fill="currentColor" stroke="none" opacity="0.85">
    <path d="M 104,470 L 110,447 L 116,470 Z"/>
    <path d="M 158,470 L 165,424 L 172,470 Z"/>
    <path d="M 212,470 L 217,453 L 222,470 Z"/>
    <path d="M 432,470 L 438,450 L 444,470 Z"/>
    <path d="M 494,470 L 501,428 L 508,470 Z"/>
    <path d="M 556,470 L 561,456 L 566,470 Z"/>
    <path d="M 614,470 L 620,442 L 626,470 Z"/>
  </g>

  <!-- ===== A rare long burst: fast rise, slow decay, a few seconds ===== -->
  <path d="M 296,470 L 302,402 C 314,391 328,397 340,409 C 356,425 368,448 382,470 Z" fill="currentColor" stroke="none" opacity="0.85"/>

  <!-- ===== MSK144: one 15 s T/R slot, packed with repeated 72 ms messages ===== -->
  <rect x="120" y="494" width="540" height="14" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <g stroke="currentColor" stroke-width="1" opacity="0.6" fill="none">
    <line x1="150" y1="496" x2="150" y2="506"/>
    <line x1="180" y1="496" x2="180" y2="506"/>
    <line x1="210" y1="496" x2="210" y2="506"/>
    <line x1="240" y1="496" x2="240" y2="506"/>
    <line x1="270" y1="496" x2="270" y2="506"/>
    <line x1="300" y1="496" x2="300" y2="506"/>
    <line x1="330" y1="496" x2="330" y2="506"/>
    <line x1="360" y1="496" x2="360" y2="506"/>
    <line x1="390" y1="496" x2="390" y2="506"/>
    <line x1="420" y1="496" x2="420" y2="506"/>
    <line x1="450" y1="496" x2="450" y2="506"/>
    <line x1="480" y1="496" x2="480" y2="506"/>
    <line x1="510" y1="496" x2="510" y2="506"/>
    <line x1="540" y1="496" x2="540" y2="506"/>
    <line x1="570" y1="496" x2="570" y2="506"/>
    <line x1="600" y1="496" x2="600" y2="506"/>
    <line x1="630" y1="496" x2="630" y2="506"/>
  </g>

  <!-- ===== Labels ===== -->
  <g fill="currentColor" stroke="none">
    <text x="46" y="62" font-size="11.5">E region: trails ionize here</text>
    <text x="330" y="40" text-anchor="end" font-size="11.5">meteor's ionized trail</text>
    <text x="88" y="283" text-anchor="end" font-size="11.5" font-weight="bold">TX</text>
    <text x="672" y="283" text-anchor="start" font-size="11.5" font-weight="bold">RX</text>
    <text x="380" y="162" text-anchor="middle" font-size="11.5">both stations aim their beams at the same trail</text>
    <text x="380" y="272" text-anchor="middle" font-size="11.5">best 28-148 MHz (6 m and 2 m dominate) - works any day of the year, out to ~1,300 miles</text>

    <text x="50" y="448" text-anchor="middle" font-size="11" transform="rotate(-90 50 448)">signal</text>
    <text x="712" y="488" text-anchor="end" font-size="11.5">time</text>
    <text x="163" y="406" text-anchor="middle" font-size="11">pings: a fraction of a second, under 0.1 s</text>
    <text x="339" y="388" text-anchor="middle" font-size="11">a rare long burst: a few seconds</text>

    <text x="120" y="488" font-size="11.5">15 s T/R slot</text>
    <text x="120" y="524" font-size="12">MSK144: a complete message every 72 ms (144 bits at 2000 baud), repeated through the whole slot</text>
    <text x="120" y="543" font-size="12">a single ping can carry a whole exchange; a 20 ms short format fits the briefest 2 m pings</text>
  </g>
</svg>
