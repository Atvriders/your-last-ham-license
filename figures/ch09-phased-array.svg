<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Helvetica, Arial, sans-serif">

  <!-- Phased verticals: two quarter-wave verticals seen from above; spacing
       and drive phase pick the pattern. The pool's three combinations:
       E9C01 (lambda/2, 180 deg out of phase -> figure-eight along the axis),
       E9C02 (lambda/4, 90 deg out of phase -> cardioid),
       E9C03 (lambda/2, in phase -> figure-eight broadside to the axis).
       Phasing lines set the phase (E9E11). -->

  <!-- ===== Title ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="400" y="30" font-size="17" font-weight="bold">PHASED VERTICALS: SPACING + PHASE PICK THE PATTERN</text>
    <text x="400" y="50" font-size="12">two &#955;/4 verticals seen from above — same hardware, three patterns, one knob: the drive phase</text>
  </g>

  <!-- ================= Panel A: lambda/2, in phase -> broadside ================= -->
  <!-- pattern: figure-eight broadside (lobes perpendicular to the array axis) -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.75">
    <circle cx="150" cy="222.5" r="47.5"/>
    <circle cx="150" cy="317.5" r="47.5"/>
  </g>
  <!-- array axis -->
  <line x1="80" y1="270" x2="220" y2="270" stroke="currentColor" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <!-- elements -->
  <g fill="currentColor" stroke="none">
    <circle cx="110" cy="270" r="7"/>
    <circle cx="190" cy="270" r="7"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="110" y="240" font-size="11">0&#176;</text>
    <text x="190" y="240" font-size="11">0&#176;</text>
  </g>
  <!-- spacing dimension -->
  <g stroke="currentColor" stroke-width="1" fill="none">
    <line x1="110" y1="288" x2="190" y2="288"/>
    <line x1="110" y1="284" x2="110" y2="292"/>
    <line x1="190" y1="284" x2="190" y2="292"/>
  </g>
  <text x="150" y="306" font-size="10" text-anchor="middle" fill="currentColor" stroke="none">&#955;/2 apart</text>
  <!-- caption -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="150" y="415" font-size="11.5" font-weight="bold">spaced &#955;/2, fed IN PHASE</text>
    <text x="150" y="433" font-size="10.5">&#8594; figure-eight BROADSIDE to the array</text>
    <text x="150" y="449" font-size="9.5">E9C03</text>
  </g>

  <!-- ================= Panel B: lambda/2, 180 deg -> end-fire ================= -->
  <!-- pattern: figure-eight along the array axis -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.75">
    <circle cx="352.5" cy="270" r="47.5"/>
    <circle cx="447.5" cy="270" r="47.5"/>
  </g>
  <line x1="310" y1="270" x2="490" y2="270" stroke="currentColor" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <g fill="currentColor" stroke="none">
    <circle cx="360" cy="270" r="7"/>
    <circle cx="440" cy="270" r="7"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="360" y="248" font-size="11">0&#176;</text>
    <text x="440" y="248" font-size="11">180&#176;</text>
  </g>
  <g stroke="currentColor" stroke-width="1" fill="none">
    <line x1="360" y1="288" x2="440" y2="288"/>
    <line x1="360" y1="284" x2="360" y2="292"/>
    <line x1="440" y1="284" x2="440" y2="292"/>
  </g>
  <text x="400" y="306" font-size="10" text-anchor="middle" fill="currentColor" stroke="none">&#955;/2 apart</text>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="400" y="415" font-size="11.5" font-weight="bold">spaced &#955;/2, fed 180&#176; OUT OF PHASE</text>
    <text x="400" y="433" font-size="10.5">&#8594; figure-eight ALONG the array axis (end-fire)</text>
    <text x="400" y="449" font-size="9.5">E9C01</text>
  </g>

  <!-- ================= Panel C: lambda/4, 90 deg -> cardioid ================= -->
  <!-- pattern: cardioid, maximum toward the lagging element -->
  <path d="M735.0,270.0 L734.5,262.6 L733.1,255.4 L730.7,248.4 L727.5,241.8 L723.4,235.8 L718.7,230.3 L713.3,225.7 L707.5,221.8 L701.3,218.7 L694.9,216.5 L688.4,215.2 L681.9,214.8 L675.6,215.2 L669.5,216.4 L663.8,218.3 L658.7,220.9 L654.0,224.0 L650.0,227.5 L646.6,231.4 L643.9,235.4 L641.8,239.6 L640.4,243.7 L639.6,247.8 L639.4,251.6 L639.6,255.2 L640.2,258.4 L641.2,261.2 L642.4,263.6 L643.7,265.6 L645.1,267.2 L646.4,268.3 L647.6,269.1 L648.6,269.6 L649.4,269.9 L649.8,270.0 L650.0,270.0 L649.8,270.0 L649.4,270.1 L648.6,270.4 L647.6,270.9 L646.4,271.7 L645.1,272.8 L643.7,274.4 L642.4,276.4 L641.2,278.8 L640.2,281.6 L639.6,284.8 L639.4,288.4 L639.6,292.2 L640.4,296.3 L641.8,300.4 L643.9,304.6 L646.6,308.6 L650.0,312.5 L654.0,316.0 L658.7,319.1 L663.8,321.7 L669.5,323.6 L675.6,324.8 L681.9,325.2 L688.4,324.8 L694.9,323.5 L701.3,321.3 L707.5,318.2 L713.3,314.3 L718.7,309.7 L723.4,304.2 L727.5,298.2 L730.7,291.6 L733.1,284.6 L734.5,277.4 L735.0,270.0 z"
        fill="none" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.75"/>
  <line x1="560" y1="270" x2="740" y2="270" stroke="currentColor" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <g fill="currentColor" stroke="none">
    <circle cx="610" cy="270" r="7"/>
    <circle cx="670" cy="270" r="7"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="610" y="248" font-size="11">0&#176;</text>
    <text x="670" y="248" font-size="11">90&#176; lag</text>
    <text x="745" y="252" font-size="9.5" font-style="italic">max</text>
  </g>
  <polygon points="735,270 722,265 722,275" fill="currentColor" stroke="none"/>
  <g stroke="currentColor" stroke-width="1" fill="none">
    <line x1="610" y1="288" x2="670" y2="288"/>
    <line x1="610" y1="284" x2="610" y2="292"/>
    <line x1="670" y1="284" x2="670" y2="292"/>
  </g>
  <text x="582" y="306" font-size="10" text-anchor="middle" fill="currentColor" stroke="none">&#955;/4 apart</text>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="640" y="415" font-size="11.5" font-weight="bold">spaced &#955;/4, fed 90&#176; OUT OF PHASE</text>
    <text x="640" y="433" font-size="10.5">&#8594; CARDIOID — maximum toward the lagging element</text>
    <text x="640" y="449" font-size="9.5">E9C02</text>
  </g>

  <!-- ===== bottom notes ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle" font-style="italic">
    <text x="400" y="500" font-size="11.5">at &#955;/2 spacing, in-phase and 180&#176;-out swap broadside for end-fire — the phase and the pattern orientation move together</text>
    <text x="400" y="524" font-size="11.5">the phase comes from the feed: phasing lines between driven elements set the pattern (E9E11)</text>
  </g>

</svg>
