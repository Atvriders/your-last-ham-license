<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 615" font-family="Helvetica, Arial, sans-serif">

  <!-- ===== Title ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="400" y="30" font-size="17" font-weight="bold">LINK BUDGET: dB BOOKKEEPING END TO END</text>
    <text x="400" y="52" font-size="12">add every gain, subtract every loss — then ask how far the result sits above the noise</text>
  </g>

  <!-- ===== Section 1: the chain (pool E4D13) ===== -->
  <text x="40" y="88" font-size="12.5" font-weight="bold" fill="currentColor" stroke="none">1 &#183; THE CHAIN — what arrives at the receiver?</text>

  <g fill="none" stroke="currentColor" stroke-width="2">
    <rect x="40" y="105" width="140" height="70" rx="8"/>
    <rect x="240" y="105" width="130" height="70" rx="8"/>
    <rect x="430" y="105" width="130" height="70" rx="8"/>
    <rect x="620" y="105" width="130" height="70" rx="8"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="110" y="130" font-size="12" font-weight="bold">TRANSMITTER</text>
    <text x="110" y="150" font-size="13" font-weight="bold">40 dBm</text>
    <text x="110" y="166" font-size="9.5" font-style="italic">= 10 W</text>

    <text x="305" y="133" font-size="11.5" font-weight="bold">TX ANTENNA</text>
    <text x="305" y="152" font-size="11">+6 dB gain</text>

    <text x="495" y="133" font-size="11.5" font-weight="bold">THE PATH</text>
    <text x="495" y="152" font-size="11">&#8722;100 dB</text>
    <text x="495" y="168" font-size="9" font-style="italic">free-space loss</text>

    <text x="685" y="133" font-size="11.5" font-weight="bold">RX ANTENNA</text>
    <text x="685" y="152" font-size="11">+3 dB gain</text>
  </g>
  <!-- arrows between boxes -->
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="182" y1="140" x2="232" y2="140"/>
    <line x1="372" y1="140" x2="422" y2="140"/>
    <line x1="562" y1="140" x2="612" y2="140"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="240,140 231,136 231,144"/>
    <polygon points="430,140 421,136 421,144"/>
    <polygon points="620,140 611,136 611,144"/>
  </g>
  <!-- running totals -->
  <g fill="currentColor" stroke="none" text-anchor="middle" font-size="9.5">
    <text x="110" y="192">total: 40</text>
    <text x="305" y="192">total: 46</text>
    <text x="495" y="192">total: &#8722;54</text>
    <text x="685" y="192">total: &#8722;51 dBm</text>
  </g>
  <!-- drop into the result bar -->
  <line x1="685" y1="197" x2="685" y2="204" stroke="currentColor" stroke-width="2" fill="none"/>
  <polygon points="685,212 681,203 689,203" fill="currentColor" stroke="none"/>
  <rect x="40" y="212" width="710" height="44" rx="8" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="395" y="230" font-size="12.5" font-weight="bold">RECEIVER INPUT: &#8722;51 dBm</text>
    <text x="395" y="246" font-size="11">40 + 6 + 3 &#8722; 100 = &#8722;51 dBm — pure bookkeeping</text>
  </g>
  <text x="400" y="276" font-size="10.5" font-style="italic" fill="currentColor" stroke="none" text-anchor="middle">the three wrong choices each drop exactly one gain: &#8722;54, &#8722;57, &#8722;60 — skipped terms land on distractors</text>

  <!-- ===== Section 2: the margin (pool E4D12) ===== -->
  <text x="40" y="316" font-size="12.5" font-weight="bold" fill="currentColor" stroke="none">2 &#183; THE MARGIN — does it beat the receiver's noise with room to spare?</text>

  <!-- dBm thermometer -->
  <g stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round">
    <line x1="130" y1="340" x2="130" y2="540"/>
    <line x1="124" y1="340" x2="136" y2="340"/>
    <line x1="124" y1="407" x2="136" y2="407"/>
    <line x1="124" y1="473" x2="136" y2="473"/>
    <line x1="124" y1="540" x2="136" y2="540"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="end" font-size="9.5">
    <text x="118" y="343.5">&#8722;80</text>
    <text x="118" y="410.5">&#8722;100</text>
    <text x="118" y="476.5">&#8722;120</text>
    <text x="118" y="543.5">&#8722;140 dBm</text>
  </g>
  <!-- received level and MDS -->
  <line x1="130" y1="370" x2="340" y2="370" stroke="currentColor" stroke-width="2.5" fill="none"/>
  <line x1="130" y1="417" x2="340" y2="417" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
  <g fill="currentColor" stroke="none" font-size="10">
    <text x="135" y="363">received: &#8722;89 dBm</text>
    <text x="135" y="430">MDS: &#8722;103 dBm (the noise floor)</text>
  </g>
  <!-- margin / reserve bracket -->
  <g stroke="currentColor" fill="none" stroke-width="1.6">
    <line x1="340" y1="370" x2="340" y2="417"/>
    <line x1="334" y1="370" x2="346" y2="370"/>
    <line x1="334" y1="397" x2="346" y2="397"/>
    <line x1="334" y1="417" x2="346" y2="417"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="9.5">
    <text x="352" y="386">+8 dB margin</text>
    <text x="352" y="410">6 dB SNR reserve</text>
  </g>

  <!-- the margin math -->
  <g fill="currentColor" stroke="none" font-size="10.5">
    <text x="470" y="365">same bookkeeping on a longer path:</text>
    <text x="470" y="385">P_rx = 40 + 10 &#8722; 3 &#8722; 136 = &#8722;89 dBm</text>
    <text x="470" y="405">margin = P_rx &#8722; MDS &#8722; required SNR</text>
    <text x="470" y="425">= &#8722;89 &#8722; (&#8722;103) &#8722; 6</text>
    <text x="470" y="445" font-weight="bold">= +8 dB of margin — the link works</text>
  </g>

  <!-- ===== bottom note ===== -->
  <text x="400" y="592" font-size="11.5" font-style="italic" fill="currentColor" stroke="none" text-anchor="middle">positive margin = room to spare for fading &#183; dBm anchors to real watts: 40 dBm = 10 W, &#8722;100 dBm = 0.1 pW</text>

</svg>
