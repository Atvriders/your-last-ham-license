<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 415" font-family="sans-serif">

  <!-- ===== title ===== -->
  <text x="400" y="32" font-size="19" font-weight="bold" fill="currentColor" text-anchor="middle">WHAT EXTRA OPENS</text>
  <text x="400" y="52" font-size="11" fill="currentColor" text-anchor="middle">the last dark slices of four HF bands light up — the rest was already yours as a General</text>

  <!-- ===== column header ===== -->
  <text x="700" y="80" font-size="9" font-weight="bold" fill="currentColor" text-anchor="middle">WHAT YOU GAIN</text>

  <!-- ===== row: 80/75 m (band 3.500-4.000) ===== -->
  <text x="32" y="98" font-size="14" font-weight="bold" fill="currentColor">80/75 m</text>
  <text x="32" y="114" font-size="8" fill="currentColor">3.500–4.000 MHz</text>
  <!-- band extent (General base) -->
  <rect x="170" y="88" width="470" height="24" stroke="currentColor" stroke-width="1.2" fill="currentColor" fill-opacity="0.05"/>
  <!-- Extra-only slices: 3.500-3.525 and 3.600-3.800 -->
  <rect x="170" y="88" width="23.5" height="24" stroke="currentColor" stroke-width="2.4" fill="currentColor" fill-opacity="0.32"/>
  <rect x="264" y="88" width="188" height="24" stroke="currentColor" stroke-width="2.4" fill="currentColor" fill-opacity="0.32"/>
  <text x="358" y="80" font-size="9" font-weight="bold" fill="currentColor" text-anchor="middle">3.600–3.800 MHz · phone + CW</text>
  <text x="172" y="127" font-size="9" font-weight="bold" fill="currentColor">3.500–3.525 MHz · CW + data</text>
  <text x="546" y="104" font-size="8.5" font-style="italic" fill="currentColor" text-anchor="middle">GENERAL</text>
  <text x="640" y="127" font-size="8" fill="currentColor" text-anchor="middle">4.000</text>
  <text x="700" y="96" font-size="8.5" fill="currentColor" text-anchor="middle">+25 kHz CW/data</text>
  <text x="700" y="110" font-size="8.5" fill="currentColor" text-anchor="middle">+200 kHz phone</text>

  <!-- ===== row: 40 m (band 7.000-7.300) ===== -->
  <text x="32" y="166" font-size="14" font-weight="bold" fill="currentColor">40 m</text>
  <text x="32" y="182" font-size="8" fill="currentColor">7.000–7.300 MHz</text>
  <rect x="170" y="156" width="470" height="24" stroke="currentColor" stroke-width="1.2" fill="currentColor" fill-opacity="0.05"/>
  <!-- Extra-only slices: 7.000-7.025 and 7.125-7.175 -->
  <rect x="170" y="156" width="39.2" height="24" stroke="currentColor" stroke-width="2.4" fill="currentColor" fill-opacity="0.32"/>
  <rect x="365.8" y="156" width="78.4" height="24" stroke="currentColor" stroke-width="2.4" fill="currentColor" fill-opacity="0.32"/>
  <text x="405" y="148" font-size="9" font-weight="bold" fill="currentColor" text-anchor="middle">7.125–7.175 MHz · phone + CW</text>
  <text x="172" y="195" font-size="9" font-weight="bold" fill="currentColor">7.000–7.025 MHz · CW + data</text>
  <text x="542" y="172" font-size="8.5" font-style="italic" fill="currentColor" text-anchor="middle">GENERAL</text>
  <text x="640" y="195" font-size="8" fill="currentColor" text-anchor="middle">7.300</text>
  <text x="700" y="164" font-size="8.5" fill="currentColor" text-anchor="middle">+25 kHz CW/data</text>
  <text x="700" y="178" font-size="8.5" fill="currentColor" text-anchor="middle">+50 kHz phone</text>

  <!-- ===== row: 20 m (band 14.000-14.350) ===== -->
  <text x="32" y="234" font-size="14" font-weight="bold" fill="currentColor">20 m</text>
  <text x="32" y="250" font-size="8" fill="currentColor">14.000–14.350 MHz</text>
  <rect x="170" y="224" width="470" height="24" stroke="currentColor" stroke-width="1.2" fill="currentColor" fill-opacity="0.05"/>
  <!-- Extra-only slices: 14.000-14.025 and 14.150-14.225 -->
  <rect x="170" y="224" width="33.6" height="24" stroke="currentColor" stroke-width="2.4" fill="currentColor" fill-opacity="0.32"/>
  <rect x="371.4" y="224" width="100.7" height="24" stroke="currentColor" stroke-width="2.4" fill="currentColor" fill-opacity="0.32"/>
  <text x="422" y="216" font-size="9" font-weight="bold" fill="currentColor" text-anchor="middle">14.150–14.225 MHz · phone + CW</text>
  <text x="172" y="263" font-size="9" font-weight="bold" fill="currentColor">14.000–14.025 MHz · CW + data</text>
  <text x="556" y="240" font-size="8.5" font-style="italic" fill="currentColor" text-anchor="middle">GENERAL</text>
  <text x="640" y="263" font-size="8" fill="currentColor" text-anchor="middle">14.350</text>
  <text x="700" y="226" font-size="8.5" fill="currentColor" text-anchor="middle">+25 kHz CW/data</text>
  <text x="700" y="240" font-size="8.5" fill="currentColor" text-anchor="middle">+75 kHz phone</text>
  <text x="700" y="254" font-size="8" font-style="italic" fill="currentColor" text-anchor="middle">DX-heavy bottom of phone</text>

  <!-- ===== row: 15 m (band 21.000-21.450) ===== -->
  <text x="32" y="302" font-size="14" font-weight="bold" fill="currentColor">15 m</text>
  <text x="32" y="318" font-size="8" fill="currentColor">21.000–21.450 MHz</text>
  <rect x="170" y="292" width="470" height="24" stroke="currentColor" stroke-width="1.2" fill="currentColor" fill-opacity="0.05"/>
  <!-- Extra-only slices: 21.000-21.025 and 21.200-21.275 -->
  <rect x="170" y="292" width="26.1" height="24" stroke="currentColor" stroke-width="2.4" fill="currentColor" fill-opacity="0.32"/>
  <rect x="378.9" y="292" width="78.3" height="24" stroke="currentColor" stroke-width="2.4" fill="currentColor" fill-opacity="0.32"/>
  <text x="418" y="284" font-size="9" font-weight="bold" fill="currentColor" text-anchor="middle">21.200–21.275 MHz · phone + CW</text>
  <text x="172" y="331" font-size="9" font-weight="bold" fill="currentColor">21.000–21.025 MHz · CW + data</text>
  <text x="549" y="308" font-size="8.5" font-style="italic" fill="currentColor" text-anchor="middle">GENERAL</text>
  <text x="640" y="331" font-size="8" fill="currentColor" text-anchor="middle">21.450</text>
  <text x="700" y="300" font-size="8.5" fill="currentColor" text-anchor="middle">+25 kHz CW/data</text>
  <text x="700" y="314" font-size="8.5" fill="currentColor" text-anchor="middle">+75 kHz phone</text>

  <!-- ===== legend ===== -->
  <rect x="170" y="349" width="18" height="12" stroke="currentColor" stroke-width="2.2" fill="currentColor" fill-opacity="0.32"/>
  <text x="196" y="359" font-size="9" fill="currentColor">= new with Extra — exact edges at each slice</text>
  <rect x="478" y="349" width="18" height="12" stroke="currentColor" stroke-width="1.2" fill="currentColor" fill-opacity="0.05"/>
  <text x="504" y="359" font-size="9" fill="currentColor">= yours since General</text>

  <!-- ===== footnotes ===== -->
  <text x="400" y="388" font-size="9.5" fill="currentColor" text-anchor="middle">Extra adds spectrum and takes nothing away — all of 160, 60, 30, 17, 12, and 10 m and every VHF/UHF band stay exactly as they were for General.</text>
  <text x="400" y="405" font-size="9.5" fill="currentColor" text-anchor="middle">Edges per §97.301(b) vs §97.301(d), ITU Region 2 · rows are schematic, not to scale.</text>

</svg>
