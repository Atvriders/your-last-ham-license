<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 925 545" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="SDR architecture: antenna, LNA, quadrature mixers I and Q fed by LO phases 90 degrees apart, low-pass filters, ADCs, DSP">
  <title>Software-defined radio — quadrature (I/Q) architecture with sampling and aliasing notes (pool E7F01/E7F05/E7F09/E7F10)</title>

  <!-- ===== Title ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="462" y="34" font-size="17" font-weight="bold">SOFTWARE-DEFINED RADIO — QUADRATURE (I/Q) ARCHITECTURE</text>
    <text x="462" y="56" font-size="11.5">the RF is mixed to baseband in two local-oscillator phases 90&#176; apart, digitized, then demodulated and filtered in software</text>
  </g>

  <!-- ===== antenna + LNA ===== -->
  <g stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="60" y1="160" x2="60" y2="125"/>
    <line x1="60" y1="125" x2="45" y2="105"/>
    <line x1="60" y1="125" x2="75" y2="105"/>
    <line x1="60" y1="160" x2="108" y2="160"/>
  </g>
  <text x="60" y="220" font-size="10" fill="currentColor" stroke="none" text-anchor="middle">ANTENNA</text>
  <rect x="110" y="125" width="110" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="165" y="155" font-size="13" font-weight="bold">LNA</text>
    <text x="165" y="175" font-size="9" font-style="italic">low-noise amplifier</text>
  </g>

  <!-- ===== RF split to the two mixers ===== -->
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="220" y1="160" x2="265" y2="160"/>
    <line x1="265" y1="160" x2="265" y2="95"/>
    <line x1="265" y1="95" x2="303" y2="95"/>
    <line x1="265" y1="160" x2="265" y2="215"/>
    <line x1="265" y1="215" x2="303" y2="215"/>
  </g>
  <g fill="currentColor" stroke="none">
    <circle cx="265" cy="160" r="4"/>
    <polygon points="311,95 302,91 302,99"/>
    <polygon points="311,215 302,211 302,219"/>
  </g>

  <!-- ===== quadrature mixers (LO enters I from the top, Q from the bottom) ===== -->
  <g stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="330" cy="95" r="25"/>
    <line x1="318" y1="83" x2="342" y2="107"/>
    <line x1="318" y1="107" x2="342" y2="83"/>
    <circle cx="330" cy="215" r="25"/>
    <line x1="318" y1="203" x2="342" y2="227"/>
    <line x1="318" y1="227" x2="342" y2="203"/>
  </g>

  <!-- ===== I and Q baseband paths: low-pass, ADC, DSP ===== -->
  <g stroke="currentColor" stroke-width="2" fill="none">
    <line x1="355" y1="95" x2="423" y2="95"/>
    <line x1="355" y1="215" x2="423" y2="215"/>
    <rect x="430" y="70" width="100" height="50" rx="8"/>
    <rect x="430" y="190" width="100" height="50" rx="8"/>
    <line x1="530" y1="95" x2="573" y2="95"/>
    <line x1="530" y1="215" x2="573" y2="215"/>
    <rect x="580" y="70" width="90" height="50" rx="8"/>
    <rect x="580" y="190" width="90" height="50" rx="8"/>
    <line x1="670" y1="95" x2="698" y2="95"/>
    <line x1="670" y1="215" x2="698" y2="215"/>
    <rect x="705" y="70" width="135" height="180" rx="8"/>
    <line x1="840" y1="160" x2="874" y2="160"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="430,95 421,91 421,99"/>
    <polygon points="430,215 421,211 421,219"/>
    <polygon points="580,95 571,91 571,99"/>
    <polygon points="580,215 571,211 571,219"/>
    <polygon points="705,95 696,91 696,99"/>
    <polygon points="705,215 696,211 696,219"/>
    <polygon points="882,160 873,156 873,164"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="389" y="85" font-size="11" font-weight="bold">I</text>
    <text x="389" y="205" font-size="11" font-weight="bold">Q</text>
    <text x="480" y="100" font-size="10.5" font-weight="bold">LOW-PASS</text>
    <text x="480" y="220" font-size="10.5" font-weight="bold">LOW-PASS</text>
    <text x="625" y="100" font-size="12" font-weight="bold">ADC</text>
    <text x="625" y="220" font-size="12" font-weight="bold">ADC</text>
    <text x="772" y="152" font-size="13" font-weight="bold">DSP</text>
    <text x="772" y="174" font-size="9.5" font-style="italic">demodulate &#183; filter</text>
    <text x="772" y="189" font-size="9.5" font-style="italic">&#183; decode &#183;</text>
    <text x="772" y="204" font-size="9.5" font-style="italic">in software</text>
    <text x="861" y="182" font-size="9.5" font-style="italic">audio / data</text>
  </g>

  <!-- ===== local oscillator: two phases 90° apart ===== -->
  <rect x="270" y="320" width="150" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="345" y="348" font-size="11" font-weight="bold">LOCAL OSCILLATOR</text>
    <text x="345" y="366" font-size="9" font-style="italic">two phases, 90&#176; apart</text>
  </g>
  <g stroke="currentColor" stroke-width="2" fill="none">
    <!-- 0° leg: over the top into mixer I -->
    <line x1="270" y1="350" x2="95" y2="350"/>
    <line x1="95" y1="350" x2="95" y2="70"/>
    <line x1="95" y1="70" x2="328" y2="70"/>
    <!-- 90° leg: through the phase-shift box into mixer Q -->
    <line x1="350" y1="320" x2="350" y2="298"/>
    <rect x="322" y="262" width="56" height="36"/>
    <line x1="350" y1="262" x2="350" y2="240"/>
    <line x1="350" y1="240" x2="332" y2="240"/>
  </g>
  <g fill="currentColor" stroke="none">
    <polygon points="330,78 326,69 334,69"/>
    <polygon points="324,240 333,236 333,244"/>
    <text x="350" y="285" font-size="12" font-weight="bold" text-anchor="middle">90&#176;</text>
    <text x="386" y="285" font-size="9" font-style="italic">phase shift</text>
    <text x="103" y="220" font-size="11">0&#176;</text>
  </g>

  <!-- ===== sampling / aliasing notes (pool E7F) ===== -->
  <text x="40" y="420" font-size="12.5" font-weight="bold" fill="currentColor" stroke="none">THE SAMPLING NUMBERS (pool E7F)</text>
  <g fill="currentColor" stroke="none" font-size="11">
    <text x="40" y="445">Nyquist (E7F05): sample at least TWICE the highest frequency component — 15 kHz of content needs a 30 kHz sample rate</text>
    <text x="40" y="467">the sample rate sets the maximum receive bandwidth of a direct-sampling SDR (E7F10)</text>
    <text x="40" y="489">aliasing: undersampled signals fold back as false signals — anti-alias filtering comes BEFORE decimation (E7F09)</text>
    <text x="40" y="523" font-size="10.5" font-style="italic">direct-sampling variant (E7F01): the ADC digitizes the RF straight from the LNA — no mixers, no local oscillator</text>
  </g>
</svg>
