<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Pool figure E6-3: six logic gate symbols numbered 1 to 6">

  <!-- Six logic gate symbols, redrawn from NCVEC pool figure E6-3
       (canon 1.4 binding spec; geometry scaled x2.7 from the published
       vector art). Grid 2 rows x 3 columns, numbered beneath (top row
       1-3, bottom row 4-6). Two inputs enter from the left on 1-4 and
       on the buffer 6; the inverter 5 has a single input. As published,
       the buffer's triangle simply ends at its apex - no output stub.
       1 = AND (flat-back D body); 2 = NAND (D body + output bubble) - E6C08;
       3 = OR (curved input, pointed output); 4 = NOR (OR + bubble) - E6C10;
       5 = NOT (triangle + bubble) - E6C11; 6 = buffer (larger triangle
       with a swept concave back, no bubble). -->

  <!-- ===== Title, centered above as published ===== -->
  <text x="390" y="42" font-size="30" font-weight="bold" text-anchor="middle"
        fill="currentColor" stroke="none">Figure E6-3</text>

  <!-- ================= Symbol 1: AND ================= -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="2.5">
      <line x1="82" y1="147" x2="112" y2="147"/>
      <line x1="82" y1="192" x2="112" y2="192"/>
      <line x1="203" y1="170" x2="241" y2="170"/>
    </g>
    <path d="M112,132 L169,132 A38.7,38.7 0 0 1 169,208 L112,208 Z" stroke-width="4.5"/>
    <text x="161" y="268" text-anchor="middle" font-size="26" font-weight="bold" fill="currentColor" stroke="none">1</text>
  </g>

  <!-- ================= Symbol 2: NAND ================= -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="2.5">
      <line x1="328" y1="147" x2="358" y2="147"/>
      <line x1="328" y1="192" x2="358" y2="192"/>
      <line x1="464" y1="170" x2="487" y2="170"/>
    </g>
    <path d="M358,132 L415,132 A38.7,38.7 0 0 1 415,208 L358,208 Z" stroke-width="4.5"/>
    <circle cx="455" cy="170" r="9" stroke-width="3.5"/>
    <text x="407" y="268" text-anchor="middle" font-size="26" font-weight="bold" fill="currentColor" stroke="none">2</text>
  </g>

  <!-- ================= Symbol 3: OR ================= -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="2.5">
      <line x1="574" y1="147" x2="612" y2="147"/>
      <line x1="574" y1="192" x2="612" y2="192"/>
      <line x1="706" y1="170" x2="753" y2="170"/>
    </g>
    <path d="M608.5,131 Q620.7,170 608.5,209 L646,209 C668,209 692,194 706.4,170 C692,146 668,131 646,131 Z" stroke-width="4.5"/>
    <text x="663" y="268" text-anchor="middle" font-size="26" font-weight="bold" fill="currentColor" stroke="none">3</text>
  </g>

  <!-- ================= Symbol 4: NOR ================= -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="2.5">
      <line x1="80" y1="392" x2="118" y2="392"/>
      <line x1="80" y1="438" x2="118" y2="438"/>
      <line x1="226" y1="415" x2="258" y2="415"/>
    </g>
    <path d="M114.4,376 Q127.8,415 114.4,454 L151.9,454 C168,454 200,439 212.9,415 C200,391 168,376 151.9,376 Z" stroke-width="4.5"/>
    <circle cx="218" cy="415" r="9" stroke-width="3.5"/>
    <text x="169" y="492" text-anchor="middle" font-size="26" font-weight="bold" fill="currentColor" stroke="none">4</text>
  </g>

  <!-- ================= Symbol 5: NOT (inverter) ================= -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="2.5">
      <line x1="328" y1="415" x2="381" y2="415"/>
      <line x1="448" y1="415" x2="494" y2="415"/>
    </g>
    <path d="M383,388 L383,443 L432,415 Z" stroke-width="4.5"/>
    <circle cx="439" cy="415" r="9" stroke-width="3.5"/>
    <text x="411" y="492" text-anchor="middle" font-size="26" font-weight="bold" fill="currentColor" stroke="none">5</text>
  </g>

  <!-- ================= Symbol 6: buffer ================= -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="2.5">
      <line x1="584" y1="376" x2="621" y2="376"/>
      <line x1="584" y1="454" x2="621" y2="454"/>
    </g>
    <!-- large triangle with a swept (concave) back; the apex is bare,
         as published -->
    <path d="M638.9,349.5 Q582.9,415 638.9,480.5 L746.1,415 Z" stroke-width="4.5"/>
    <text x="665" y="492" text-anchor="middle" font-size="26" font-weight="bold" fill="currentColor" stroke="none">6</text>
  </g>
</svg>
