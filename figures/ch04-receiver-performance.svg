<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Helvetica, Arial, sans-serif">

  <!-- ===== Title ===== -->
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="400" y="30" font-size="17" font-weight="bold">RECEIVER PERFORMANCE: THE THREE NUMBERS THAT MATTER</text>
    <text x="400" y="52" font-size="12">sensitivity hears the weak ones &#183; dynamic range survives the loud ones &#183; selectivity picks one from the crowd</text>
  </g>

  <!-- ===== Row 1: sensitivity (MDS / noise floor) ===== -->
  <text x="40" y="88" font-size="12.5" font-weight="bold" fill="currentColor" stroke="none">1 &#183; SENSITIVITY — how weak a signal can you still hear?</text>
  <g stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="105" x2="60" y2="195"/>
    <line x1="60" y1="195" x2="300" y2="195"/>
    <!-- noise floor wiggle -->
    <polyline points="60,176 72,180 84,174 96,179 108,175 120,181 132,177 144,173 156,178 168,176 180,180 192,175 204,179 216,174 228,178 240,176 252,181 264,175 276,179 288,177 300,180" stroke-width="1.6"/>
  </g>
  <line x1="60" y1="160" x2="300" y2="160" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round">
    <line x1="185" y1="177" x2="185" y2="140"/>
  </g>
  <g fill="currentColor" stroke="none">
    <text x="66" y="155" font-size="9.5" font-weight="bold">MDS</text>
    <text x="66" y="190" font-size="9" font-style="italic">noise floor</text>
    <text x="185" y="132" font-size="9.5" font-style="italic" text-anchor="middle">a signal must clear the noise</text>
  </g>
  <g fill="currentColor" stroke="none" font-size="10.5">
    <text x="445" y="118">MDS = minimum discernible signal — the weakest whisper it hears</text>
    <text x="445" y="138">the floor is physics: &#8722;174 dBm in a 1 Hz bandwidth</text>
    <text x="445" y="158">wider filter, more noise: 50 Hz &#8594; 1,000 Hz adds 13 dB</text>
    <text x="445" y="178">match the bandwidth to the mode for the best SNR</text>
  </g>

  <!-- ===== Row 2: dynamic range (IMD3 / overload-free) ===== -->
  <text x="40" y="258" font-size="12.5" font-weight="bold" fill="currentColor" stroke="none">2 &#183; DYNAMIC RANGE — how loud a neighbor before it misbehaves?</text>
  <g stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="275" x2="60" y2="365"/>
    <line x1="60" y1="365" x2="300" y2="365"/>
    <!-- noise floor wiggle -->
    <polyline points="60,346 72,350 84,344 96,349 108,345 120,351 132,347 144,343 156,348 168,346 180,350 192,345 204,349 216,344 228,348 240,346 252,351 264,345 276,349 288,347 300,350" stroke-width="1.6"/>
  </g>
  <line x1="60" y1="285" x2="300" y2="285" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round">
    <line x1="140" y1="347" x2="140" y2="292"/>
    <line x1="170" y1="347" x2="170" y2="298"/>
  </g>
  <!-- blocking dynamic range double arrow -->
  <line x1="290" y1="287" x2="290" y2="345" stroke="currentColor" stroke-width="1.4" fill="none"/>
  <g fill="currentColor" stroke="none">
    <polygon points="290,283 286,291 294,291"/>
    <polygon points="290,349 286,341 294,341"/>
    <text x="66" y="280" font-size="9" font-weight="bold">1 dB compression</text>
    <text x="283" y="316" font-size="9" text-anchor="middle" transform="rotate(-90 283 316)">blocking DR</text>
    <text x="155" y="270" font-size="9.5" font-style="italic" text-anchor="middle">two loud neighbors</text>
  </g>
  <g fill="currentColor" stroke="none" font-size="10.5">
    <text x="445" y="288">blocking dynamic range: noise floor &#8594; 1 dB of compression</text>
    <text x="445" y="308">past it: cross-modulation and desense from strong neighbors</text>
    <text x="445" y="328">IP3 (40 dBm) is an extrapolated yardstick, not a working level</text>
    <text x="445" y="348">odd-order products (2f1 &#8722; f2) land back in-band</text>
  </g>

  <!-- ===== Row 3: selectivity (blocking / adjacent) ===== -->
  <text x="40" y="428" font-size="12.5" font-weight="bold" fill="currentColor" stroke="none">3 &#183; SELECTIVITY — how well it ignores the station next door</text>
  <g stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="445" x2="60" y2="535"/>
    <line x1="60" y1="535" x2="300" y2="535"/>
  </g>
  <!-- filter passband -->
  <path d="M 110 535 L 150 462 L 230 462 L 270 535" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round">
    <line x1="190" y1="535" x2="190" y2="480"/>
    <line x1="287" y1="535" x2="287" y2="450"/>
  </g>
  <g fill="currentColor" stroke="none">
    <text x="190" y="452" font-size="9.5" text-anchor="middle">the filter passband</text>
    <text x="190" y="525" font-size="9" font-style="italic" text-anchor="middle">wanted signal</text>
    <text x="180" y="552" font-size="9.5" font-style="italic" text-anchor="middle">the tall neighbor sits outside the passband — the filter strips it</text>
  </g>
  <g fill="currentColor" stroke="none" font-size="10.5">
    <text x="445" y="458">a narrow roofing filter cuts strong close-in signals early</text>
    <text x="445" y="478">removing them early protects blocking dynamic range</text>
    <text x="445" y="498">IF Shift slides the passband away from adjacent QRM</text>
    <text x="445" y="518">a preselector kills out-of-band signals before they intermod</text>
  </g>

  <!-- ===== bottom note ===== -->
  <text x="400" y="615" font-size="11.5" font-style="italic" fill="currentColor" stroke="none" text-anchor="middle">MDS = the weakest whisper &#183; dynamic range = the loudest shout tolerated &#183; selectivity = the width of its ear</text>

</svg>
